name: CI do livro (build, testes e PDFs)

# Portão de qualidade: roda os testes do tutor, regenera o corpus e prova que o
# site e os PDFs constroem. NÃO publica — a publicação é do Vercel,
# que constrói o mesmo motor com SEM_PDF=1. O docs/ é gerado, não versionado.

on:
  push:
    branches: [main, "0*"]
    paths:
      - "livro/**"
      - "publicar/**"
      - "chat-companion/**"
      - "po-zero/**"
      - "adr/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Princípio VI: as skills instaladas são a regra vigente, e divergência
      # silenciosa em relação ao Maestro é dívida. O repositório do Maestro é
      # privado, então o CI só consegue checar quando houver um token com acesso
      # (secret MAESTRO_TOKEN). Sem o segredo, o passo é pulado — e a sincronia
      # continua sendo feita localmente com scripts/sync-maestro.sh.
      - name: Sincronia com o Maestro
        if: ${{ secrets.MAESTRO_TOKEN != '' }}
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.MAESTRO_TOKEN }}@github.com/GHDaru/maestro.git /tmp/maestro
          MAESTRO=/tmp/maestro scripts/sync-maestro.sh --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes do chat companion
        run: pip install -q -r requirements.txt pytest httpx && python -m pytest -q
        working-directory: chat-companion/backend
      # O PASSO QUE FALTAVA, e a falta era séria.
      #
      # A ADR 0014 (D3) estabeleceu que "número no livro tem dono, e o dono é um
      # teste": as suítes do `po-zero` LEEM o texto dos capítulos e exigem que
      # cada número medido apareça lá na forma exata — e que as versões antigas
      # não apareçam. É o vínculo que existe porque duas faixas erradas foram
      # publicadas. (O número de suítes cresce a cada Parte; contá-lo aqui só
      # criaria mais um número para envelhecer.)
      #
      # Esses testes nunca rodaram aqui. O filtro `paths:` acima listava livro/,
      # publicar/ e chat-companion/, e **não** po-zero/ — então mudar um script
      # de medição não disparava o CI, e o passo que os executasse não existia.
      # O selo 🔵 do handbook depende deles, e o portão que confere o selo roda
      # no build do site, não sobre a medição.
      #
      # Encontrado pelo comitê da rodada dos cadernos, e consertado antes de o
      # primeiro caderno existir — porque acrescentar artefato novo a um
      # pipeline que não cobre o antigo é multiplicar o buraco.
      - name: Testes da medição (po-zero)
        run: pip install -q pytest numpy && python -m pytest po-zero -q

      # O corpus do tutor é regerado a cada build: o chat nunca responde por uma
      # versão antiga do livro (dívida herdada do motor original, corrigida aqui).
      - name: Regerar o corpus do tutor
        run: python build_corpus.py
        working-directory: chat-companion/backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências do motor
        run: npm ci
        working-directory: publicar
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Gerar o site (Markdown -> docs/)
        run: npm run build
        working-directory: publicar
      - name: Instalar Chromium (para os PDFs)
        run: npx playwright install --with-deps chromium
        working-directory: publicar
      # A ilha interativa só pode ser verificada com navegador, então este passo
      # vem DEPOIS da instalação do Chromium — e não dentro de `npm run build`,
      # que precisa continuar verde no caminho do Vercel, onde não há navegador.
      - name: Verificar a ilha interativa em navegador
        run: npm run verifica:ilha
        working-directory: publicar
      - name: Gerar PDFs (livro completo + por capítulo)
        run: npm run pdf
        working-directory: publicar
      - name: Limpar temporário de impressão
        run: rm -f docs/_print.html
      # Verifica também o modo do Vercel (sem Chromium, portanto sem PDFs):
      # os dois caminhos de build precisam ficar verdes (o Vercel constrói com SEM_PDF=1).
      - name: Verificar o build do Vercel (SEM_PDF)
        run: SEM_PDF=1 node build.mjs && SEM_PDF=1 node verifica-capitulos.mjs
        working-directory: publicar
