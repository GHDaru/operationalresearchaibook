<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon "Teoria das Restrições": três elos de uma cadeia, o do meio em
       âmbar — a restrição, o elo que determina a resistência do conjunto. -->
  <rect width="64" height="64" rx="14" fill="#0d1a30"/>
  <g fill="none" stroke="#78aeff" stroke-width="5" stroke-linecap="round">
    <path d="M 20 16 L 20 26"/>
    <path d="M 44 16 L 44 26"/>
    <path d="M 20 44 L 20 50"/>
    <path d="M 44 44 L 44 50"/>
  </g>
  <g fill="none" stroke="#78aeff" stroke-width="5">
    <rect x="13" y="10" width="14" height="10" rx="5"/>
    <rect x="37" y="10" width="14" height="10" rx="5"/>
  </g>
  <rect x="13" y="26" width="38" height="18" rx="9" fill="none" stroke="#e0a24a" stroke-width="6"/>
  <circle cx="32" cy="35" r="3.5" fill="#e0a24a"/>
</svg>
