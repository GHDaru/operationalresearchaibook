<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon "Pesquisa Operacional": a região viável — um poliedro convexo com
       o vértice ótimo em âmbar. O ótimo mora sempre num canto. -->
  <rect width="64" height="64" rx="14" fill="#0d1a30"/>
  <!-- eixos -->
  <g stroke="#78aeff" stroke-width="3" stroke-linecap="round" opacity=".55" fill="none">
    <path d="M 14 50 H 52"/>
    <path d="M 14 50 V 13"/>
  </g>
  <!-- o poliedro -->
  <path d="M 18 50 L 18 32 L 30 20 L 46 30 L 46 50 Z"
        fill="#78aeff" fill-opacity=".22" stroke="#78aeff" stroke-width="4" stroke-linejoin="round"/>
  <!-- o vértice ótimo -->
  <circle cx="30" cy="20" r="6" fill="none" stroke="#e0a24a" stroke-width="4"/>
</svg>
