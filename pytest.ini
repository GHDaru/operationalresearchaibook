# Coleta de testes — e uma armadilha específica de repositório em português.
#
# O padrão do pytest é `python_functions = test*`, SEM o sublinhado. Num
# repositório escrito em português isso coleta como teste qualquer função cujo
# nome comece com "teste" — e `teste_do_ponto_medio`, que é uma função de
# medição do po-zero com parâmetros próprios, era coletada e falhava com
# "fixture 'pertence' not found". Falso vermelho vindo do nome, não do código.
#
# Exigir o sublinhado resolve a classe inteira: `teste_*` deixa de casar,
# `test_*` continua casando. Corrigir aqui, e não renomeando a função, é o que
# protege as próximas — e neste repositório "teste" é uma palavra comum.
[pytest]
python_functions = test_*
python_files = test_*.py
python_classes = Test*
